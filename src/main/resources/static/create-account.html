
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Bank Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <div class="form-card">

        <div class="form-title">
            <h1>🏦 BankPro</h1>
            <h2>Create Bank Account</h2>
            <p>Create a new customer bank account</p>
        </div>

        <form id="accountForm">

            <div class="input-group">
                <label>Customer ID</label>
                <input type="number" id="customerId"
                       placeholder="Enter Customer ID"
                       min="1" required>
            </div>

            <div class="input-group">
                <label>Account Number</label>
                <input type="text"
                       value="Auto-generated by system"
                       readonly>
                <small>Account number will be generated automatically.</small>
            </div>

            <div class="input-group">
                <label>Account Type</label>
                <select id="accountType" required>
                    <option value="">Select Account Type</option>
                    <option value="SAVINGS">Savings Account</option>
                    <option value="CURRENT">Current Account</option>
                </select>
            </div>

            <div class="input-group">
                <label>Initial Balance</label>
                <input type="number" id="balance"
                       placeholder="Enter initial balance"
                       min="0" step="0.01" required>
            </div>

            <div class="input-group">
                <label>Branch</label>
                <input type="text" id="branch"
                       placeholder="Enter branch" required>
            </div>

            <div class="input-group">
                <label>IFSC Code</label>
                <input type="text" id="ifscCode"
                       placeholder="Enter IFSC code" required>
            </div>

            <button type="submit" class="submit-btn">
                Create Account
            </button>

        </form>

        <p id="accountMessage"></p>

        <a href="index.html" class="back-link">
            ← Back to Dashboard
        </a>

    </div>
</div>

<script src="account.js"></script>
</body>
</html>
