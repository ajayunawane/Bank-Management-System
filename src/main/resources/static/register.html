<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Register Customer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="form-container">
    <div class="form-card">
        <div class="form-title"><h1>🏦 BankPro</h1>
            <h2>Register Customer</h2>
            <p>Create a new customer</p></div>
        <form id="customerForm">
            <div class="input-group"><label>Full Name</label><input id="fullName" type="text" required></div>
            <div class="input-group"><label>Date of Birth</label><input id="dateOfBirth" type="date" required></div>
            <div class="input-group"><label>Gender</label><select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select></div>
            <div class="input-group"><label>Contact Number</label><input id="contactNo" type="text" required></div>
            <div class="input-group"><label>Email</label><input id="email" type="email" required></div>
            <div class="input-group"><label>Address</label><input id="address" type="text" required></div>
            <div class="input-group"><label>City</label><input id="city" type="text" required></div>
            <button class="submit-btn" type="submit">Register Customer</button>
        </form>
        <p id="customerMessage"></p><a class="back-link" href="index.html">← Back to Dashboard</a>
    </div>
</div>
<script src="register.js"></script>
</body>
</html>
