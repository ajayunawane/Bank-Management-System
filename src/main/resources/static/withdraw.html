<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Withdraw Money</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="form-container">
    <div class="form-card">
        <div class="form-title"><h1>🏦 BankPro</h1>
            <h2>Withdraw Money</h2>
            <p>Withdraw money from customer account</p></div>
        <form id="withdrawForm">
            <div class="input-group"><label>Account Number</label><input id="accountNo" type="text" required></div>
            <div class="input-group"><label>Withdraw Amount</label><input id="amount" type="number" min="1" required>
            </div>
            <button class="submit-btn" type="submit">💸 Withdraw Money</button>
        </form>
        <p id="withdrawMessage"></p><a class="back-link" href="index.html">← Back to Dashboard</a>
    </div>
</div>
<script src="withdraw.js"></script>
</body>
</html>
