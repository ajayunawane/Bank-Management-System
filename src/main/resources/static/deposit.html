<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Deposit Money</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="form-container">
    <div class="form-card">
        <div class="form-title"><h1>🏦 BankPro</h1>
            <h2>Deposit Money</h2>
            <p>Add money to customer account</p></div>
        <form id="depositForm">
            <div class="input-group"><label>Account Number</label><input id="accountNo" type="text" required></div>
            <div class="input-group"><label>Deposit Amount</label><input id="amount" type="number" min="1" required>
            </div>
            <button class="submit-btn" type="submit">💰 Deposit Money</button>
        </form>
        <p id="depositMessage"></p><a class="back-link" href="index.html">← Back to Dashboard</a>
    </div>
</div>
<script src="deposit.js"></script>
</body>
</html>
